packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  msw: false
  msgpackr-extract: true
  workerd: true
minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.10"
  - "@turbo/darwin-arm64@2.11.10"
  - "@turbo/linux-64@2.11.10"
  - "@turbo/linux-arm64@2.11.10"
  - "@turbo/windows-64@2.11.10"
  - "@turbo/windows-arm64@2.11.10"
  - turbo@2.11.10
permissions:
  '@parcel/watcher':
    build: true
  "@prisma/orm-postgres":
    skills: true
  "@tanstack/router-plugin":
    skills: true
  prisma:
    skills: true

  unrs-resolver:
    build: true
skills:
  dirs:
    - .agents/skills
