packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  msw: false
  msgpackr-extract: true
  workerd: true
permissions:
  '@parcel/watcher':
    build: true
  "@prisma/orm-postgres":
    skills: true
  "@tanstack/router-plugin":
    skills: true
  prisma:
    skills: true

  unrs-resolver:
    build: true
skills:
  dirs:
    - .agents/skills
